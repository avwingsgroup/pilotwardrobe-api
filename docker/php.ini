; Production PHP settings for the Pilotwardrobe API image.
expose_php = Off
memory_limit = 256M
; Media uploads are capped by config/platform.php (media limits); keep PHP slightly above.
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

session.cookie_httponly = 1
date.timezone = UTC
