# /etc/nginx/sites-available/pilotwardrobe-api  (see docs/deployment-vps.md)
# Replace api.example.com with your API host. Certbot adds the HTTPS server block and redirect.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    root /var/www/pilotwardrobe-api/current/public;
    index index.php;

    # Media uploads are capped at 15 MB by the app; leave headroom for multipart overhead.
    client_max_body_size 30m;

    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/pilotwardrobe-api.access.log;
    error_log  /var/log/nginx/pilotwardrobe-api.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never serve dotfiles (.env, .git) even if they end up under public/.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
