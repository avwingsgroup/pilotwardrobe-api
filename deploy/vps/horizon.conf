; /etc/supervisor/conf.d/pilotwardrobe-horizon.conf  (see docs/deployment-vps.md)
; Horizon runs the payments, notifications/default and long queues (config/horizon.php).
; Deploys call `php artisan horizon:terminate`; Supervisor then starts it again on the new release.

[program:pilotwardrobe-horizon]
process_name=%(program_name)s
command=/usr/bin/php /var/www/pilotwardrobe-api/current/artisan horizon
directory=/var/www/pilotwardrobe-api/current
user=deploy
autostart=true
autorestart=true
; Long jobs (exports, broadcasts) may run up to 30 minutes; let them finish on stop.
stopwaitsecs=1900
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/pilotwardrobe-api/shared/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
