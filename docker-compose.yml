# Local / staging stack: API (FrankenPHP), Horizon workers, scheduler, PostgreSQL, Redis, Mailpit.
#   cp .env.example .env && php artisan key:generate (or set APP_KEY) && docker compose up -d --build
#   docker compose run --rm migrate
#   docker compose exec app php artisan db:seed     (demo photos need ./docs/PW-images mounted, see below)
# Production runs the same image with managed PostgreSQL/Redis (see docs/deployment.md).

x-env: &env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  QUEUE_LONG_CONNECTION: redis-long
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: mailpit
  MAIL_PORT: 1025

x-app: &app
  build: .
  image: pilotwardrobe-api:local
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./docs/PW-images:/app/docs/PW-images:ro
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      <<: *env
      CONTAINER_ROLE: web
    ports:
      - "${APP_PORT:-8000}:8080"

  horizon:
    <<: *app
    environment:
      <<: *env
      CONTAINER_ROLE: horizon
    stop_grace_period: 60s

  scheduler:
    <<: *app
    environment:
      <<: *env
      CONTAINER_ROLE: scheduler

  migrate:
    <<: *app
    environment:
      <<: *env
      CONTAINER_ROLE: migrate
    restart: "no"
    profiles: ["tools"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pilotwardrobe}
      POSTGRES_USER: ${DB_USERNAME:-pilotwardrobe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
