name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, gd, intl, zip, bcmath, pcntl, exif
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Larastan (level 5, no baseline)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Composer audit (known vulnerabilities)
        run: composer audit --no-dev --locked

  tests:
    name: Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pilotwardrobe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: pilotwardrobe_test
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, gd, intl, zip, bcmath, pcntl, exif
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment (placeholders only)
        run: cp .env.example .env && php artisan key:generate

      - name: Migrations apply, roll back and re-apply cleanly
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
          php artisan db:seed --class=ReferenceDataSeeder --force

      - name: Test suite
        run: php artisan test

      - name: OpenAPI document builds
        run: php artisan scramble:export --path=storage/app/openapi.json

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pilotwardrobe-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
