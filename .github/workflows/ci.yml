name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: a newer push must not kill a deploy halfway through.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, gd, intl, zip, bcmath, pcntl, exif
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Larastan (level 5, no baseline)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Composer audit (known vulnerabilities)
        run: composer audit --no-dev --locked

  tests:
    name: Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pilotwardrobe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: pilotwardrobe_test
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, gd, intl, zip, bcmath, pcntl, exif
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment (placeholders only)
        run: cp .env.example .env && php artisan key:generate

      - name: Migrations apply, roll back and re-apply cleanly
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
          php artisan db:seed --class=ReferenceDataSeeder --force

      - name: Test suite
        run: php artisan test

      - name: Production caches build (as deploy.sh runs them)
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan event:cache
          php artisan view:cache
          php artisan optimize:clear

      - name: OpenAPI document builds
        run: php artisan scramble:export --path=storage/app/openapi.json

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pilotwardrobe-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous deployment: every push to main that passes the checks above is deployed to
  # the VPS by running deploy/vps/deploy.sh there over SSH. The server only accepts this key
  # for that one command (forced command in authorized_keys), see docs/deployment-vps.md §16.
  deploy:
    name: Deploy to production (VPS)
    needs: [quality, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check deployment secrets
        id: secrets
        run: |
          missing=""; present=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -n "${!name}" ]; then present=$((present + 1)); else missing="$missing $name"; fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::warning::Automatic deploy is not configured yet: add the VPS_* secrets (docs/deployment-vps.md §16). Skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/deployment-vps.md §16)"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.secrets.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }}
        if: steps.secrets.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
              "$VPS_USER@$VPS_HOST" deploy

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
